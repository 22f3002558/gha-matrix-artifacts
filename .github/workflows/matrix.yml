name: Matrix Build with Artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required identifier step
      - name: matrix-90139be
        run: echo "Building on ${{ matrix.os }} with Node ${{ matrix.node }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Generate build artifact
        shell: bash
        run: |
          echo "OS=${{ matrix.os }}" > build-info.txt
          echo "NODE=${{ matrix.node }}" >> build-info.txt
          echo "Timestamp=$(date +%s)" >> build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-90139be-${{ matrix.os }}-node${{ matrix.node }}
          path: build-info.txt
